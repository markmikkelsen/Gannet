name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Big GABA test files (GE, Philips, and Siemens S01, TE = 68 ms), hosted
  # as a release asset
  TEST_DATA_URL: https://github.com/markmikkelsen/Gannet/releases/download/test-data-v2/gannet-test-data-v2.zip
  TEST_DATA_KEY: gannet-test-data-v2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Gannet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore cached test data
        id: cache-data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/data
          key: ${{ env.TEST_DATA_KEY }}

      - name: Download test data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o test-data.zip "$TEST_DATA_URL"
          mkdir -p tests/data
          unzip -q test-data.zip -d tests/data
          rm test-data.zip
          find tests/data -type f | sort

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: latest
          cache: true
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Run tests
        uses: matlab-actions/run-tests@214a16e600ef2c705a4b2dd6c0794dc6957682a9 # v3.3.0
        env:
          GANNET_TEST_DATA_REQUIRED: "1"
        with:
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: test-results/
