name: Update dependencies - bids-matlab, dicm2nii, etc.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: ${{ github.event_name }} - ${{ github.actor }} is updating dependencies

on:
  schedule:
    - cron: 0 0 * * 1 # Every monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gannet repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout bids-matlab repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bids-standard/bids-matlab
          path: bids-matlab_tmp/
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout dicm2nii repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xiangruili/dicm2nii
          path: dicm2nii_tmp/
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout export_fig repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: altmany/export_fig
          path: export_fig_tmp/
          fetch-depth: 1
          persist-credentials: false

      - name: Record dependency versions
        id: record
        run: |
          {
            echo "body<<EOF"
            echo "Done by a [GitHub Action](https://github.com/markmikkelsen/Gannet/blob/main/.github/workflows/update_dependencies.yml)."
            echo ""
            echo "| Dependency | Commit |"
            echo "| --- | --- |"
            echo "| [bids-matlab](https://github.com/bids-standard/bids-matlab) | [\`$(git -C bids-matlab_tmp rev-parse --short HEAD)\`](https://github.com/bids-standard/bids-matlab/commit/$(git -C bids-matlab_tmp rev-parse HEAD)) |"
            echo "| [dicm2nii](https://github.com/xiangruili/dicm2nii) | [\`$(git -C dicm2nii_tmp rev-parse --short HEAD)\`](https://github.com/xiangruili/dicm2nii/commit/$(git -C dicm2nii_tmp rev-parse HEAD)) |"
            echo "| [export_fig](https://github.com/altmany/export_fig) | [\`$(git -C export_fig_tmp rev-parse --short HEAD)\`](https://github.com/altmany/export_fig/commit/$(git -C export_fig_tmp rev-parse HEAD)) |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Copy files from separate repos to current repo
        run: |
          rm -rf bids-matlab/ dicm2nii/ export_fig/
          mkdir -p bids-matlab/ dicm2nii/ export_fig/
          rsync -av --exclude '.git' bids-matlab_tmp/ bids-matlab/
          rsync -av --exclude '.git' dicm2nii_tmp/ dicm2nii/
          rsync -av --exclude '.git' --exclude '.ignore' export_fig_tmp/ export_fig/
          rm -rf bids-matlab_tmp/ dicm2nii_tmp/ export_fig_tmp/

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/update-dependencies
          commit-message: Sync with dependencies repos
          base: main
          delete-branch: true
          title: "[BOT] Update dependencies - bids-matlab, dicm2nii, etc."
          body: ${{ steps.record.outputs.body }}
          labels: dependencies
